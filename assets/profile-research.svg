<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 270" role="img" aria-label="研究方向：生成式AI与资产定价、基金持仓与量化因子研究。">
<title>研究方向：生成式AI与资产定价、基金持仓与量化因子研究。</title>
<rect x="0" y="0" width="1200" height="270" rx="0" fill="#111211" stroke="none"/><rect x="0" y="0" width="1200" height="270" rx="2" fill="#191b19" stroke="none"/><text x="28" y="36" fill="#b7c3ad" font-family="Menlo,Consolas,'Liberation Mono','PingFang SC','Microsoft YaHei',monospace" font-size="14" font-weight="500" letter-spacing="1.7">RESEARCH</text><text x="28" y="104" fill="#e7e8e2" font-family="Menlo,Consolas,'Liberation Mono','PingFang SC','Microsoft YaHei',monospace" font-size="29" font-weight="500" >生成式 AI 与资产定价</text><text x="28" y="147" fill="#a4aaa2" font-family="Menlo,Consolas,'Liberation Mono','PingFang SC','Microsoft YaHei',monospace" font-size="22" font-weight="400" >用企业招聘文本衡量 AI 暴露，</text><text x="28" y="182" fill="#a4aaa2" font-family="Menlo,Consolas,'Liberation Mono','PingFang SC','Microsoft YaHei',monospace" font-size="22" font-weight="400" >分析它与 A 股资产定价的关系。</text><text x="623" y="104" fill="#e7e8e2" font-family="Menlo,Consolas,'Liberation Mono','PingFang SC','Microsoft YaHei',monospace" font-size="29" font-weight="500" >量化因子研究</text><text x="623" y="147" fill="#a4aaa2" font-family="Menlo,Consolas,'Liberation Mono','PingFang SC','Microsoft YaHei',monospace" font-size="22" font-weight="400" >尝试从基金持仓等数据中构建因子，</text><text x="623" y="182" fill="#a4aaa2" font-family="Menlo,Consolas,'Liberation Mono','PingFang SC','Microsoft YaHei',monospace" font-size="22" font-weight="400" >记录数据时点、回测设置和检验结果。</text></svg>
