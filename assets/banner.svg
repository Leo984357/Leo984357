<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060d"/>
      <stop offset="50%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <linearGradient id="flow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Flowing gradient shapes -->
  <path d="M0,120 Q150,60 300,110 T600,90 T900,130 L900,200 L0,200 Z" fill="url(#flow1)"/>
  <path d="M0,160 Q200,80 450,130 T900,100 L900,200 L0,200 Z" fill="url(#flow2)"/>

  <rect width="900" height="200" fill="url(#spot)"/>

  <!-- Content -->
  <text x="60" y="102" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="-0.5">
    李硕仁
    <tspan font-size="28" font-weight="300" fill="#6b7280" letter-spacing="0.5">  Shuoren Li</tspan>
  </text>

  <text x="60" y="132" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#4b5563" letter-spacing="0.8">
    Financial Engineering  ·  GDUFS
  </text>

  <line x1="60" y1="154" x2="120" y2="154" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

  <text x="60" y="177" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#374151" letter-spacing="1.2">
    QUANTITATIVE INVESTMENT  ·  ALTERNATIVE DATA  ·  ASSET PRICING
  </text>
</svg>
