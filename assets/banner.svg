    <tspan fill="#ffffff">:</tspan>
    <tspan fill="#3b82f6">~</tspan>
    <tspan fill="#ffffff">$ </tspan>
    <tspan fill="#e0e0e0">cat about.md</tspan>
  </text>

  <text x="50" y="112" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#e0e0e0">
    <tspan fill="#e0e0e0">Shuoren Li — Financial Engineering @ GDUFS</tspan>
  </text>

  <text x="50" y="152" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="17" fill="#00d68f">
    <tspan fill="#00d68f">shuoren@profile</tspan>
    <tspan fill="#ffffff">:</tspan>
    <tspan fill="#3b82f6">~</tspan>
    <tspan fill="#ffffff">$ </tspan>
  </text>

  <rect x="375" y="137" width="9" height="16" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <text x="105" y="185" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10" fill="#333" text-anchor="middle">Quantitative Investment  |  Alternative Data  |  Asset Pricing</text>
