<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a">
        <animate attributeName="stop-color" values="#0a0a1a;#0d1b2a;#1b2838;#0d1b2a;#0a0a1a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1a1a3e">
        <animate attributeName="stop-color" values="#1a1a3e;#1b2838;#0d1b2a;#1b2838;#1a1a3e" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="900" height="200" fill="url(#bg)" />

  <rect x="30" y="20" width="840" height="160" rx="10" fill="#111122" stroke="#2a2a4a" stroke-width="1.5" />

  <rect x="30" y="20" width="840" height="32" rx="10" fill="#0d0d1f" />
  <rect x="30" y="42" width="840" height="10" fill="#0d0d1f" />

  <circle cx="52" cy="36" r="5.5" fill="#ff5f56" />
  <circle cx="70" cy="36" r="5.5" fill="#ffbd2e" />
  <circle cx="88" cy="36" r="5.5" fill="#27c93f" />

  <text x="450" y="39" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" fill="#555" text-anchor="middle" dominant-baseline="middle">bash — shuoren@profile</text>

  <text x="50" y="82" font-family="'SF Mono','Fira Code',Consolas,'Courier New',monospace" font-size="17" fill="#00d68f">
