<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#14141e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>
  <rect width="900" height="200" fill="url(#grid)"/>

  <!-- Decorative glow on right -->
  <circle cx="750" cy="100" r="160" fill="url(#glow)"/>

  <!-- Accent bar -->
  <rect x="40" y="60" width="3" height="80" rx="1.5" fill="#34d399"/>

  <!-- Name -->
  <text x="62" y="98" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.3">
    李硕仁
    <tspan font-size="26" font-weight="300" fill="#9ca3af" letter-spacing="0.3"> Shuoren Li</tspan>
  </text>

  <!-- Title -->
  <text x="62" y="128" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#6b7280" letter-spacing="0.5">
    Financial Engineering  |  GDUFS  |  Quant Finance &amp; AI Research
  </text>

  <!-- Separator -->
  <line x1="62" y1="148" x2="838" y2="148" stroke="#1f2937" stroke-width="1"/>

  <!-- Tags -->
  <text x="62" y="173" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" letter-spacing="0.8">
    QUANTITATIVE INVESTMENT
  </text>
  <circle cx="216" cy="169" r="1.5" fill="#4b5563"/>
  <text x="226" y="173" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" letter-spacing="0.8">
    ALTERNATIVE DATA
  </text>
  <circle cx="362" cy="169" r="1.5" fill="#4b5563"/>
  <text x="372" y="173" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#4b5563" letter-spacing="0.8">
    ASSET PRICING
  </text>

  <!-- Right section: abstract signal bars -->
  <g transform="translate(720, 55)" opacity="0.7">
    <rect x="0" y="24" width="6" height="24" rx="2" fill="#34d399" opacity="0.9"/>
    <rect x="12" y="16" width="6" height="32" rx="2" fill="#34d399" opacity="0.7"/>
    <rect x="24" y="8" width="6" height="40" rx="2" fill="#34d399" opacity="0.5"/>
    <rect x="36" y="20" width="6" height="28" rx="2" fill="#34d399" opacity="0.8"/>
    <rect x="48" y="12" width="6" height="36" rx="2" fill="#34d399" opacity="0.6"/>
    <rect x="60" y="28" width="6" height="20" rx="2" fill="#34d399" opacity="0.85"/>
    <rect x="72" y="4" width="6" height="44" rx="2" fill="#34d399" opacity="0.45"/>
    <rect x="84" y="18" width="6" height="30" rx="2" fill="#34d399" opacity="0.75"/>
    <rect x="96" y="10" width="6" height="38" rx="2" fill="#34d399" opacity="0.55"/>
  </g>

  <!-- Signal line tracing across bars -->
  <polyline points="723,63 735,53 747,73 759,59 771,67 783,77 795,49 807,63 819,55"
    fill="none" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small pulse dot at end -->
  <circle cx="819" cy="55" r="2.5" fill="#34d399" opacity="0.6"/>
  <circle cx="819" cy="55" r="5" fill="none" stroke="#34d399" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
